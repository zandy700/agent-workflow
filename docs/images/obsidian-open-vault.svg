<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="400" rx="16" fill="#f6f7f9"/>
  <g transform="translate(30,24)">
    <rect width="600" height="352" rx="10" fill="#202020"/>
    <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
    <circle cx="38" cy="16" r="6" fill="#febc2e"/>
    <circle cx="58" cy="16" r="6" fill="#28c840"/>
    <rect x="0" y="32" width="170" height="320" fill="#262626"/>
    <text x="85" y="190" text-anchor="middle" font-size="12" fill="#7a7a7a">(no vaults yet)</text>
    <text x="385" y="74" text-anchor="middle" font-size="24" font-weight="700" fill="#dadada">Obsidian</text>

    <g transform="translate(190,104)">
      <text x="0" y="18" font-size="14" font-weight="600" fill="#dadada">Create new vault</text>
      <text x="0" y="38" font-size="12" fill="#9a9a9a">Create a new Obsidian vault under a folder.</text>
      <rect x="320" y="6" width="70" height="28" rx="6" fill="#3a3a3a"/>
      <text x="355" y="25" text-anchor="middle" font-size="13" fill="#dadada">Create</text>
    </g>
    <g transform="translate(190,170)">
      <rect x="-10" y="-8" width="410" height="60" rx="8" fill="none" stroke="#ff8c1a" stroke-width="3"/>
      <text x="0" y="18" font-size="14" font-weight="600" fill="#ffffff">Open folder as vault</text>
      <text x="0" y="38" font-size="12" fill="#bdbdbd">Choose an existing folder of Markdown files.</text>
      <rect x="320" y="6" width="70" height="28" rx="6" fill="#7c5cff"/>
      <text x="355" y="25" text-anchor="middle" font-size="13" fill="#ffffff">Open</text>
    </g>
    <g transform="translate(190,236)">
      <text x="0" y="18" font-size="14" font-weight="600" fill="#dadada">Open vault from Obsidian Sync</text>
      <text x="0" y="38" font-size="12" fill="#9a9a9a">Not needed for this workflow.</text>
      <rect x="320" y="6" width="70" height="28" rx="6" fill="#3a3a3a"/>
      <text x="355" y="25" text-anchor="middle" font-size="13" fill="#dadada">Sign in</text>
    </g>
  </g>

  <path d="M 692 190 L 652 190" stroke="#ff8c1a" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff8c1a"/></marker></defs>
  <text x="700" y="160" font-size="16" font-weight="600" fill="#1f2328">1. Click Open</text>
  <text x="700" y="194" font-size="14" fill="#57606a">2. Pick this folder:</text>
  <text x="700" y="214" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">Obsidian Sync/</text>
  <text x="700" y="234" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">  ObsidianVault</text>
  <text x="700" y="262" font-size="14" fill="#57606a">(in your home folder)</text>
  <text x="870" y="388" text-anchor="end" font-size="11" fill="#8c959f">Illustration, not a screenshot</text>
</svg>
